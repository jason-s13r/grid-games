name: Pages

# Deploying is downstream of releasing: release.yml calls this workflow with
# the release commit dispat just pushed, so what Pages serves is always a
# version that was actually cut. A push to main deliberately does not deploy
# — it would overwrite a released site with unreleased code.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build. Defaults to whatever triggered the run.
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release commit when release.yml calls us, the triggering commit
          # otherwise. checkout treats an empty ref as unset, but being explicit
          # keeps the fallback readable.
          ref: ${{ inputs.ref || github.sha }}
          # dispat derives versions from commit history, so a shallow clone
          # would leave it with nothing to read.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: yohimik/dispat@v1

      - name: Stamp versions with dispat
        # A release commit already carries its real versions, so this is a
        # no-op there. It only does work for a manual run off unreleased main,
        # where it shows what the next release would be. Never fatal: a version
        # stamp is not worth failing a deploy over.
        continue-on-error: true
        run: |
          dispat autoversion
          echo "--- versions being deployed ---"
          node -p "require('./apps/web/package.json').version"
          node -p "require('./apps/prototype/package.json').version"

      # Parcel does not clear its output directory, so a restored cache or a
      # renamed package can leave bundles from an earlier build lying around to
      # be published alongside the current ones.
      - name: Clean build outputs
        run: rm -rf apps/*/dist packages/*/dist

      # Topological, so @tessera/sim compiles before the client that imports it.
      - run: pnpm -r build

      - name: Assemble site
        run: |
          mkdir -p _site/web _site/prototype
          cp public/index.html _site/index.html
          cp -r apps/web/dist/. _site/web/
          cp -r apps/prototype/dist/. _site/prototype/
          # Without this, Pages runs Jekyll and drops files beginning with _.
          touch _site/.nojekyll
          find _site -maxdepth 2 -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # From v4 the action excludes dotfiles, which would drop .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
