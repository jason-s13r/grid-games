# Release configuration. Conventional commits drive the versions; dispat reads
# them, computes the graph from the package manifests, and publishes in
# dependency order.
#
# THE COMPATIBILITY CONTRACT IS THE STATE HASH, NOT THE PUBLIC API.
#
# Peers only interoperate if their simulations produce bit-identical state for
# the same (genesis, move log). So for @tessera/sim the semver rule is
# stricter than usual:
#
#   * ANY change that moves the hash is BREAKING -> feat!: / fix!: / major,
#     even when no exported signature changed. Rule tweaks, spawn-weight
#     changes, RNG draw-order changes and snapshot layout changes all qualify.
#   * Only genuinely hash-neutral work is a minor or patch: docs, types,
#     renderer-facing helpers, performance work that provably preserves the
#     draw order.
#
# packages/sim exports PROTOCOL_VERSION; a peer refuses to join a game whose
# genesis names a different major. That check is what turns a silent overnight
# desync into an refusal at the lobby.

scripts:
  build-lib: pnpm build
  # Regenerates pnpm-lock.yaml after the version stage, so the release commit
  # never carries a lockfile that disagrees with the manifests beside it.
  sync-lock: pnpm install --lockfile-only
  # Nothing goes to a registry. The library ships as a tarball attached to its
  # GitHub release, which a bot peer or the observer can install straight from
  # the download URL. Packed into a temp dir, never the package folder, because
  # the release commit stages that folder and would otherwise carry the .tgz.
  publish-lib: |
    set -eu
    out=$(mktemp -d)
    pnpm pack --pack-destination "$out" >/dev/null
    echo "DISPAT_EXPORT_GITHUB=$out/$(ls "$out")" >> "$DISPAT_OUTPUT"
    echo "packed $DISPAT_PACKAGE $DISPAT_VERSION for the GitHub release"
  build-app: pnpm build
  no-publish: echo "$DISPAT_PACKAGE ships as a deployed app, not a registry package"
spaces:
  # Shared libraries: the sim, and later the wire protocol and mesh. These are
  # what bot peers and the observer consume, so each release carries a tarball.
  packages:
    path: packages
    autoVersion:
      manifests: root
      # Only touch ranges already declared with the workspace protocol, and
      # write them back unchanged. Rewriting workspace:* to ^0.2.0 breaks the
      # local link and leaves pnpm-lock.yaml stale, which fails the deploy's
      # --frozen-lockfile. Package versions are still written.
      match: ["workspace:*"]
      range: "workspace:*"
      syncLock: [sync-lock]
    flow:
      build: build-lib
      publish: publish-lib
  # Deployables: the web frontend, and later the headless bot peer and the
  # archive/observer peer. Versioned and changelogged, never published to npm.
  apps:
    path: apps
    autoVersion:
      manifests: root
      # Only touch ranges already declared with the workspace protocol, and
      # write them back unchanged. Rewriting workspace:* to ^0.2.0 breaks the
      # local link and leaves pnpm-lock.yaml stale, which fails the deploy's
      # --frozen-lockfile. Package versions are still written.
      match: ["workspace:*"]
      range: "workspace:*"
      syncLock: [sync-lock]
    flow:
      build: build-app
      publish: no-publish
dependencies:
  web:
    - sim
initials:
  prototype: 0.1.0
  sim: 0.1.0
  web: 0.1.0

# --- release records -----------------------------------------------------
#
# The release run writes what it did: a changelog per package, one release
# commit carrying all of them, an annotated tag per released package
# ({name}@{version}, so web@0.2.0) and a GitHub release. All of it is opt-in;
# commit is disabled by default.
#
# The Pages deploy keys off the commit this produces rather than off main, so
# the published site is always a version that exists.
changelog:
  enabled: true
commit:
  enabled: true
  push: true
  # The lockfile lives at the root, outside every package folder, so it has to
  # be named or syncLock's regeneration would be left out of the commit.
  include: [pnpm-lock.yaml]
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com
github:
  enabled: true
  allPackages: true
