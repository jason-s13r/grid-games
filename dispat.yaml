# Release configuration. Conventional commits drive the versions; dispat reads
# them, computes the graph from the package manifests, and releases in
# dependency order.
#
# Commit scopes name packages: feat(sim), fix(web), feat(sim,protocol,web)!.
# A scope that is not a package is an error. Changes to the repository as a
# whole use the repo scope (chore(repo):, ci(repo):, docs(repo):) and release
# nothing.
#
# THE COMPATIBILITY CONTRACT IS THE STATE HASH, NOT THE PUBLIC API.
#
# Clients only interoperate if their simulations produce bit-identical state
# for the same (genesis, move log). So for @tessera/sim the semver rule is
# stricter than usual:
#
#   * ANY change that moves the hash is BREAKING -> feat(sim)!: / fix(sim)!:,
#     even when no exported signature changed. Rule tweaks, spawn-weight
#     changes, RNG draw-order changes and snapshot layout changes all qualify.
#   * Only genuinely hash-neutral work is a minor or patch: docs, types,
#     renderer-facing helpers, performance work that provably preserves the
#     draw order.
#
# The sim's major version IS the protocol version. dispat writes each released
# version into packages/sim/src/version.ts, and PROTOCOL_VERSION is read from
# it. A client refuses a game whose genesis names a protocol it does not
# support, which turns a silent desync into a refusal at the door.

scripts:
  build-lib: pnpm build
  # Regenerates pnpm-lock.yaml after the version stage, so the release commit
  # never carries a lockfile that disagrees with the manifests beside it.
  sync-lock: pnpm install --lockfile-only
  # Nothing goes to a registry. A library ships as a tarball attached to its
  # GitHub release, so a custom client can install it from the download URL.
  # Packed into a temp dir, never the package folder, because the release
  # commit stages that folder and would otherwise carry the .tgz.
  publish-lib: |
    set -eu
    out=$(mktemp -d)
    pnpm pack --pack-destination "$out" >/dev/null
    echo "DISPAT_EXPORT_GITHUB=$out/$(ls "$out")" >> "$DISPAT_OUTPUT"
    echo "packed $DISPAT_PACKAGE $DISPAT_VERSION for the GitHub release"
  build-app: pnpm build
  # An app's build is kept as a zip on its GitHub release: the exact bundle
  # that was released, reproducible from its own artifact.
  export-app: |
    set -eu
    out=$(mktemp -d)
    site="$out/tessera-$DISPAT_PACKAGE-$DISPAT_VERSION.zip"
    (cd dist && zip -qr "$site" .)
    echo "DISPAT_EXPORT_GITHUB=$site" >> "$DISPAT_OUTPUT"
    echo "zipped $DISPAT_PACKAGE $DISPAT_VERSION for the GitHub release"
spaces:
  # Shared libraries: the sim, the protocol and the room. Each release carries
  # a tarball.
  packages:
    path: packages
    autoVersion:
      manifests: root
      # Only touch ranges already declared with the workspace protocol, and
      # write them back unchanged. Rewriting workspace:* to ^0.2.0 breaks the
      # local link and leaves pnpm-lock.yaml stale, which fails the deploy's
      # --frozen-lockfile. Package versions are still written.
      match: ["workspace:*"]
      range: "workspace:*"
      syncLock: [sync-lock]
      # The version the sim reports about itself at runtime, and where
      # PROTOCOL_VERSION comes from. Only the sim carries this file.
      replace:
        - files: ["src/version.ts"]
          find: 'VERSION = "{previous}"'
          write: 'VERSION = "{version}"'
    flow:
      build: build-lib
      publish: publish-lib
  # Deployables: the web client. Versioned and changelogged, never published to
  # npm — each release carries its build as a zip.
  apps:
    path: apps
    autoVersion:
      manifests: root
      match: ["workspace:*"]
      range: "workspace:*"
      syncLock: [sync-lock]
    flow:
      build: build-app
      publish: export-app
dependencies:
  protocol:
    - sim
  room:
    - sim
    - protocol
  web:
    - sim
    - protocol
# Scopes that are deliberately not packages, and resolve to nothing without a
# diagnostic.
#   release  dispat's own release-commit scope
#   repo     repository-wide changes that release nothing: chore(repo):, ci(repo):
#   ci       a fix(ci) commit on main from before scopes had to name packages
#   the rest packages that were removed, still named by older commits
nonPackageScopes: [release, repo, ci, net, headless, observer, bot, host, api, prototype]
# --- release records -----------------------------------------------------
#
# The release run writes what it did: a changelog per package, one release
# commit carrying all of them, an annotated tag per released package
# ({name}@{version}, so web@0.2.0) and a GitHub release.
changelog:
  enabled: true
commit:
  enabled: true
  push: true
  # The lockfile lives at the root, outside every package folder, so it has to
  # be named or syncLock's regeneration would be left out of the commit.
  include: [pnpm-lock.yaml]
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com
github:
  enabled: true
  allPackages: true
